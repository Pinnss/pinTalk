# pintalk config
# Fastest path: run `pintalk init` to generate this file interactively.
# Otherwise copy to config.yaml and fill in real values.

server:
  # Public domain — only needed for tls.mode=letsencrypt-domain. Leave empty for
  # IP / LAN setups.
  domain: ""

  # Which IP to bind HTTP/HTTPS on. Empty = all interfaces (0.0.0.0).
  # If LuCI already uses :80/:443 on the LAN IP, set this to the WAN IP.
  listen_ip: ""

  http_port: 80    # prod: 80 (ACME challenge / CA download / redirect to HTTPS)
  https_port: 443  # prod: 443 (the app)
  dev_port: 8080   # only for `serve --dev`

# How the HTTPS certificate is obtained.
tls:
  # mode:
  #   ""                  auto — letsencrypt-domain if server.domain is set, else selfsigned
  #   selfsigned          no domain needed; works by IP / on a LAN. Browsers warn
  #                       until the CA is installed from http://<host>/pintalk-ca.crt
  #   letsencrypt-domain  trusted cert for server.domain (needs a public domain, ports 80+443)
  #   letsencrypt-ip      trusted cert for a bare public IP (needs a public IP, ports 80+443)
  mode: selfsigned

  # Public IP to certify in letsencrypt-ip mode. If empty, turn.external_ip is used.
  public_ip: ""

  # Optional ACME account email (letsencrypt-* modes).
  email: ""

  # Where certificates and the self-signed CA are cached.
  cert_cache: ./certs

# Ephemeral TURN credentials via REST (RFC 5766 §5). Needed to relay media when a
# peer is behind symmetric NAT / CGNAT. On a pure LAN it can stay disabled.
turn:
  enabled: false

  # Which addresses TURN listens on (UDP+TCP). 0.0.0.0 = all interfaces.
  listen_ip: 0.0.0.0
  port: 3478

  # Public IP that TURN advertises in ICE candidates. Behind NAT this is the WAN
  # IP. Empty lets it auto-resolve from the domain.
  external_ip: ""

  # Realm — any stable string; usually the domain or IP. Empty defaults sensibly.
  realm: ""

  # Secret for the HMAC-SHA1 in ephemeral credentials. Generate: openssl rand -hex 32
  shared_secret: "ЗАМЕНИ-МЕНЯ-НА-СЛУЧАЙНУЮ-СТРОКУ-32-БАЙТА"

  # How long each credential set lives (minutes).
  cred_ttl_minutes: 60

# Host accounts (can create rooms).
# Password is a bcrypt hash — generate with: pintalk hash 'my-password'
hosts:
  - username: pin
    password_hash: "$2a$12$ЗАМЕНИ.НА.НАСТОЯЩИЙ.BCRYPT.ХЭШ"
