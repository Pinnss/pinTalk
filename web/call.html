<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>pintalk — звонок</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="pintalk-room-id" content="{{.RoomID}}">
  <meta name="pintalk-is-host" content="{{.IsHost}}">
  <meta name="pintalk-host-name" content="{{.Host}}">
</head>
<body class="call-body">

<!-- Guest join screen -->
<div id="join-screen" class="join" {{if .IsHost}}hidden{{end}}>
  <div class="join-card">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
    </div>
    <h1>pintalk</h1>
    <p class="muted">Звонок от <b>{{.Host}}</b></p>
    <input id="name-input" type="text" maxlength="40" placeholder="Ваше имя" autofocus autocomplete="off">
    <button id="join-btn" class="primary full">Войти в звонок</button>
  </div>
</div>

<!-- Call screen -->
<div id="call-screen" class="stage" {{if not .IsHost}}hidden{{end}}>
  <!-- top bar: status + (host only) copy link -->
  <header class="topbar-floating">
    <span id="status" class="status-pill">Подключение…</span>
    <span class="topbar-spacer"></span>
    {{if .IsHost}}
      <button id="copy-link" class="icon-btn" title="Скопировать ссылку">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>
    {{end}}
  </header>

  <!-- Big (main) video -->
  <video id="main-video" autoplay playsinline></video>
  <div id="placeholder" class="placeholder">
    <div class="placeholder-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48" opacity="0.4">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 11h-6"></path>
        <path d="M19 8v6"></path>
      </svg>
      <span>Ожидание собеседника…</span>
    </div>
  </div>

  <!-- Small (PiP) video — tap to swap -->
  <div id="pip" class="pip" title="Нажмите чтобы поменять местами">
    <video id="pip-video" autoplay playsinline muted></video>
    <div class="pip-hint">↕</div>
  </div>

  <!-- Control bar -->
  <footer class="controls-bar">
    <button id="mic-btn" class="ctrl-btn" title="Микрофон">
      <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <button id="cam-btn" class="ctrl-btn" title="Камера">
      <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16 16H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4 0h6a2 2 0 0 1 2 2v3m0 0l5-3v10"></path>
      </svg>
    </button>

    <button id="flip-btn" class="ctrl-btn" title="Сменить камеру" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>

    <button id="share-btn" class="ctrl-btn" title="Демонстрация экрана" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
    </button>

    <button id="swap-btn" class="ctrl-btn" title="Поменять плитки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>

    <button id="hangup-btn" class="ctrl-btn hangup" title="Завершить">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path d="M21.7 15.4 19.3 14a1 1 0 0 0-1 .1l-2 1.6c-2.3-.7-4.3-2.7-5-5l1.6-2a1 1 0 0 0 .1-1L11.6 5.3a1 1 0 0 0-1-.6L7 5a1 1 0 0 0-.9 1.1A18 18 0 0 0 18 17.9a1 1 0 0 0 1.1-.9l.3-3.7a1 1 0 0 0-.7-.9z" transform="rotate(135 12 12)"/>
      </svg>
    </button>
  </footer>
</div>

<script src="/static/app.js"></script>
</body>
</html>
